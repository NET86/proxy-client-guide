name: Validate directory changes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check commit identity
        run: python3 scripts/check_commit_identity.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Compile scripts
        run: python3 -m py_compile scripts/build_readme.py scripts/check_commit_identity.py

      - name: Verify generated README
        run: python3 scripts/build_readme.py --check

      - name: Check whitespace
        run: git diff --check
