name: Refresh client directory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'data/observations.json'

permissions:
  contents: write

concurrency:
  group: refresh-client-directory
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'NET86/proxy-client-guide' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out latest main for refresh
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Check triggering revision is current
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$remote_head" ]]; then
            echo "Unable to resolve origin/main." >&2
            exit 1
          fi
          checked_out="$(git rev-parse HEAD)"
          if [[ "$remote_head" != "$checked_out" ]]; then
            echo "Superseded after checkout: checkout=$checked_out current=$remote_head"
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "base_sha=$checked_out" >> "$GITHUB_OUTPUT"
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Audit sources and render directory
        if: steps.freshness.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build_readme.py --audit
          git diff --check

      - name: Publish generated changes
        if: steps.freshness.outputs.current == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md data/observations.json; then
            echo "No generated directory changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_head="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$remote_head" ]]; then
            echo "Unable to resolve origin/main before publish." >&2
            exit 1
          fi
          if [[ "$remote_head" != "${{ steps.freshness.outputs.base_sha }}" ]]; then
            echo "Superseded before publish: base=${{ steps.freshness.outputs.base_sha }} current=$remote_head"
            exit 0
          fi
          git add README.md data/observations.json
          git commit -m "chore: refresh client observations"
          if ! git push origin HEAD:main; then
            remote_head="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
            if [[ -n "$remote_head" && "$remote_head" != "${{ steps.freshness.outputs.base_sha }}" ]]; then
              echo "Superseded during publish: base=${{ steps.freshness.outputs.base_sha }} current=$remote_head"
              exit 0
            fi
            echo "Publishing failed without a remote main advance." >&2
            exit 1
          fi

      - name: Enforce audit health
        if: always() && steps.freshness.outputs.current == 'true'
        run: python3 scripts/build_readme.py --health-check --check
