name: Refresh client directory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'data/observations.json'

permissions:
  contents: write

concurrency:
  group: refresh-client-directory
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'NET86/proxy-client-guide' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Audit sources and render directory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build_readme.py --audit
          git diff --check

      - name: Publish generated changes
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md data/observations.json; then
            echo "No generated directory changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/observations.json
          git commit -m "chore: refresh client observations"
          git push origin HEAD:main

      - name: Enforce audit health
        if: always()
        run: python3 scripts/build_readme.py --health-check --check
